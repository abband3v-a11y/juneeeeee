<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send Love & Actions</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h2>Send a Message</h2>
        
        <div class="input-group">
            <label for="senderName">Your Name</label>
            <input type="text" id="senderName" placeholder="Enter your name">
        </div>

        <div class="input-group">
            <label for="targetId">Recipient Discord ID</label>
            <input type="text" id="targetId" placeholder="e.g. 123456789012345678">
        </div>

        <div class="toggles">
            <label class="toggle-container">
                <input type="checkbox" id="anonToggle">
                <span class="checkmark"></span>
                Send Anonymously
            </label>

            <label class="toggle-container">
                <input type="checkbox" id="silentToggle">
                <span class="checkmark"></span>
                Silent Notification (@silent)
            </label>
        </div>

        <div class="action-selector">
            <button type="button" class="action-btn active" onclick="setAction('love', 'loves', '❤️')">❤️ Love</button>
            <button type="button" class="action-btn" onclick="setAction('pat', 'patted', '🐾')">🐾 Pat</button>
            <button type="button" class="action-btn" onclick="setAction('kiss', 'kissed', '💋')">💋 Kiss</button>
        </div>

        <div class="clicker-section">
            <button type="button" class="clicker-btn" onclick="incrementAction()">
                <span id="actionCounter">0</span>
            </button>
            <p class="click-hint">Click to stack!</p>
        </div>

        <button type="button" class="send-btn" onclick="sendAction()">Send Message</button>
        <p id="status"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
