<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Direct DM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h2>Direct Message</h2>

        <div class="input-group">
            <label for="senderName">Your Name</label>
            <input type="text" id="senderName" placeholder="Enter your name">
        </div>

        <div class="input-group">
            <label for="targetId">Recipient Discord ID</label>
            <input type="text" id="targetId" placeholder="e.g. 123456789012345678">
        </div>

        <div class="input-group">
            <label for="customMessage">Message</label>
            <textarea id="customMessage" rows="4" placeholder="Type your message here..."></textarea>
        </div>

        <div class="toggles">
            <label class="toggle-container">
                <input type="checkbox" id="anonToggle">
                <span class="checkmark"></span>
                Send Anonymously
            </label>

            <label class="toggle-container">
                <input type="checkbox" id="silentToggle">
                <span class="checkmark"></span>
                Silent Notification (@silent)
            </label>
        </div>

        <button type="button" class="send-btn" onclick="sendCustomDM()">Send Message</button>
        <p id="status"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
